[workspace]
members = [
    "iciaws_router",
    "iciaws_macros",
    "iciaws_dynamo",
    "iciaws_s3",
    "iciaws_ses",
    "iciaws_sns",
    "iciaws_test_helper",
    "iciaws_token"]
    
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
aws-config = "1.12.0"
aws-sdk-dynamodb = "1.130.0"
http = "1.5.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
dotenv = "0.15.0"
base64 = "0.23.1"
lambda_http = "1.3.1"
aws_lambda_events = { version = "1.2.0", features = ["apigw"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
