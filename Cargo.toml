[workspace]
members = [
    "iciaws_router",
    "iciaws_macros",
    "iciaws_dynamo",
    "iciaws_s3",
    "iciaws_ses",
    "iciaws_sns",
    "iciaws_test_helper"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
aws-config = "1.8.18"
aws-sdk-dynamodb = "1.116.0"
http = "1.4.2"
anyhow = "1.0.102"
thiserror = "2.0.18"
dotenv = "0.15.0"
base64 = "0.22.1"
lambda_http = "1.2.1"
aws_lambda_events = { version = "1.2.0", features = ["apigw"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
